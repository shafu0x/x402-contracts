# Full reference https://github.com/foundry-rs/foundry/tree/master/config

[profile.default]
  auto_detect_solc = false
  bytecode_hash = "none"
  # evm_version = "shanghai"
  fuzz = { runs = 1_000 }
  optimizer = true
  optimizer_runs = 5000
  out = "out"
  solc = "0.8.26"
  src = "src"
  test = "test"

[rpc_endpoints]
  sepolia = "${SEPOLIA_RPC_URL}"
